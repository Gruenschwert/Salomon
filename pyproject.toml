[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gs-assistant"
version = "0.1.0"
description = "Interner KI-Assistent der Grünschwert GmbH (Telegram, Claude, Shopify)"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21,<23",
    "anthropic>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.16",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "cryptography>=42",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pgserver>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
